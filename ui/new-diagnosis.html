<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CuraLm – New Diagnosis</title>

  <style>
    :root{
      --bg:#f6fbff;
      --text:#0f172a;
      --muted:#64748b;
      --line: rgba(15,23,42,.08);

      --brand:#16b5b8;
      --brand2:#2dd4bf;

      --shadow2: 0 8px 18px rgba(2,18,28,.10);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:linear-gradient(180deg,#fff 0%, var(--bg) 40%, #fff 100%);
    }
    .container{ width:min(1080px, 92vw); margin:0 auto; }

    /* Header */
    header{
      position:sticky; top:0; z-index:50;
      background:rgba(255,255,255,.78);
      backdrop-filter:saturate(140%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0; gap:18px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      font-weight:700;
    }
    .logoImg{
      width:34px; height:34px;
      object-fit:contain;
      display:block;
    }
    nav ul{
      list-style:none; padding:0;margin:0;
      display:flex; gap:18px; align-items:center;
      color:var(--muted); font-weight:600; font-size:14px;
    }
    nav a{
      color:inherit; text-decoration:none;
      padding:8px 10px; border-radius:999px;
      transition:.15s ease;
    }
    nav a:hover{ background:rgba(2,132,199,.08); color:#0b3b4a; }
    nav a.active{ background:rgba(20,184,166,.12); color:#0b3b4a; }

    .userbtn{
      width:34px;height:34px;border-radius:999px;
      border:1px solid var(--line); background:#fff;
      display:grid; place-items:center;
      box-shadow:0 10px 18px rgba(2,18,28,.06);
      cursor:pointer;
    }

    /* Page frame */
    .page{ padding:26px 0 40px; }
    .chatShell{
      background:#fff;
      border:1px solid rgba(2,18,28,.07);
      border-radius:22px;
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .chatBody{
      padding:18px 18px 12px;
      background:linear-gradient(180deg,#ffffff 0%, #fbfeff 70%, #ffffff 100%);
      min-height: 560px;
      max-height: 62vh;
      overflow:auto;
    }

    /* Message rows */
    .row{
      display:flex;
      align-items:flex-end;
      gap:10px;
      margin:16px 0;
    }
    .row.bot{ justify-content:flex-start; }
    .row.user{ justify-content:flex-end; }

    .avatar{
      width:32px;height:32px;border-radius:999px;
      flex:0 0 auto;
      display:grid; place-items:center;
      border:1px solid rgba(2,18,28,.06);
      background:#fff;
      box-shadow:0 10px 16px rgba(2,18,28,.06);
    }
    .avatar.bot{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      border:none;
    }
    .avatar.user{
      background:linear-gradient(135deg,#60a5fa,#2563eb);
      border:none;
    }

    .bubble{
      max-width: 720px;
      border-radius:16px;
      padding:12px 14px;
      border:1px solid rgba(2,18,28,.06);
      box-shadow:0 10px 18px rgba(2,18,28,.06);
      font-size:13px;
      line-height:1.5;
      color:rgba(15,23,42,.78);
      background:#fff;
      font-weight:400; /* no bold */
    }
    .bubble.bot{ background: #f2f7fb; }
    .bubble.user{
      max-width: 620px;
      background: linear-gradient(135deg, #1fb2ef, #2b7de9);
      color:rgba(255,255,255,.94);
      border:none;
      font-weight:400; /* no bold */
    }

    .time{
      font-size:11px;
      color:rgba(100,116,139,.8);
      margin-top:6px;
      font-weight:400;
    }
    .row.user .time{ text-align:right; }

    /* Typing dots */
    .typing{ display:inline-flex; gap:6px; align-items:center; }
    .dot{
      width:6px; height:6px; border-radius:999px;
      background:rgba(100,116,139,.55);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay: .15s; }
    .dot:nth-child(3){ animation-delay: .30s; }
    @keyframes bounce{
      0%, 80%, 100%{ transform: translateY(0); opacity:.6; }
      40%{ transform: translateY(-4px); opacity:1; }
    }

    /* Composer */
    .composer{
      /* شلت الخط الفاصل هنا */
      border-top:none;
      padding:14px;
      background:#fff;
    }
    .composerRow{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .input{
      flex:1;
      border:1px solid rgba(2,18,28,.10);
      border-radius:16px;
      padding:12px 14px;
      font-size:13px;
      outline:none;
      box-shadow:0 10px 18px rgba(2,18,28,.04);
    }
    .send{
      border:0;
      background:linear-gradient(135deg, #20b5ef, #2b7de9);
      color:#fff;
      padding:12px 16px;
      border-radius:16px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 14px 22px rgba(43,125,233,.25);
      display:inline-flex;
      align-items:center;
      gap:10px;
    }
    .send:active{ transform: translateY(1px); }

    @media (max-width: 900px){
      nav ul{ display:none; }
      .bubble{ max-width: 82vw; }
    }
  </style>
</head>

<body>
<header>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <img class="logoImg" src="logo.png" alt="CuraLm Logo">
        <div>CuraLm</div>
      </div>

      <nav>
        <ul>
          <li><a href="dashboard.html" data-nav="home">Home</a></li>
          <li><a href="new-diagnosis.html" class="active" data-nav="new">New Diagnosis</a></li>
          <li><a href="treatment-plan.html" data-nav="plan">Treatment Plan</a></li>
          <li><a href="settings.html" data-nav="settings">Settings</a></li>
        </ul>
      </nav>

      <button class="userbtn" id="userBtn" title="Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<section class="page">
  <div class="container">
    <div class="chatShell">
      <div class="chatBody" id="chatBody"></div>

      <div class="composer">
        <div class="composerRow">
          <input class="input" id="symptomInput" placeholder="Describe symptoms in detail..." />
          <button class="send" id="sendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M22 2L15 22l-4-9-9-4 20-7Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            Send
          </button>
        </div>
      </div>

    </div>
  </div>
</section>

<script>
  const chatBody = document.getElementById('chatBody');
  const input = document.getElementById('symptomInput');
  const sendBtn = document.getElementById('sendBtn');

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }
  function scrollToBottom(){ chatBody.scrollTop = chatBody.scrollHeight; }

  function botAvatarSvg(){
    return `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M8 10h8M9 14h6" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 2a7 7 0 0 0-7 7v1a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V9a7 7 0 0 0-7-7Z"
              stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 19l-2 3" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 19l2 3" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    `;
  }
  function userAvatarSvg(){
    return `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M20 21a8 8 0 0 0-16 0" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="8" r="4" stroke="white" stroke-width="2"/>
      </svg>
    `;
  }

  function addBotTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `
      <div class="avatar bot" aria-hidden="true">${botAvatarSvg()}</div>
      <div style="flex:1">
        <div class="bubble bot">
          <span class="typing" aria-label="AI typing">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </span>
        </div>
        <div class="time">Just now</div>
      </div>
    `;
    chatBody.appendChild(row);
    scrollToBottom();
    return row;
  }

  function setBotText(row, text){
    row.querySelector('.bubble').textContent = text;
    scrollToBottom();
  }

  function addUserMessage(text){
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div>
        <div class="bubble user">${escapeHtml(text)}</div>
        <div class="time">Just now</div>
      </div>
      <div class="avatar user" aria-hidden="true">${userAvatarSvg()}</div>
    `;
    chatBody.appendChild(row);
    scrollToBottom();
  }

  // رسالة بسيطة بدون (Model not connected) وبدون Next Step وبدون Bold
  function initialAiMessage(){
    return "Hello. This page is a UI prototype only for now. You can type symptoms and see your messages in the chat. The medical analysis will be enabled later when the model is integrated.";
  }

  // عند الدخول: typing ثم أول رسالة
  window.addEventListener('DOMContentLoaded', () => {
    const typingRow = addBotTyping();
    setTimeout(() => {
      setBotText(typingRow, initialAiMessage());
    }, 850);
  });

  // عند الإرسال: رد بسيط بدون أي بادج أو بولد
  function handleSend(){
    const text = input.value.trim();
    if(!text) return;

    addUserMessage(text);
    input.value = '';

    const typingRow = addBotTyping();
    setTimeout(() => {
      setBotText(
        typingRow,
        "Thanks. Your message was captured. Analysis will be available later after model integration."
      );
    }, 650);
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleSend();
  });
</script>
</body>
</html>
